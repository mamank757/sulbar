name: Update ENSO Data Weekly

on:
  schedule:
    # Berjalan setiap hari Senin pukul 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di tab Actions GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    # Memberikan izin agar workflow bisa melakukan git commit & push kembali ke repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl requests

      - name: Run Processing Script
        run: python process_enso.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.userid"
          
          # Tambahkan file hasil export jika ada perubahan
          git add nino34_bom_oni_format.csv nino34_bom_oni_format.xlsx || true
          
          # Cek apakah ada perubahan data, jika ya lakukan commit & push
          git diff --staged --quiet || git commit -m "Auto-update ENSO data: $(date +'%Y-%m-%d')"
          git push

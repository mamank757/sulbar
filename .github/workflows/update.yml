name: Update data iklim
on:
  schedule:
    - cron: '0 3 * * *'   # tiap hari 03:00 UTC (BoM/CPC memperbarui mingguan)
  workflow_dispatch:
  push:
    paths: ['Data_Curah_Hujan_-_Mamuju.xlsx', 'build_data.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy openpyxl requests
      - run: python build_data.py
        env:
          SHEET_XLSX_URL: ${{ secrets.SHEET_XLSX_URL }}  # opsional
      - name: Commit hasil
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git add cache 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update data $(date -u +%F)" && git push)

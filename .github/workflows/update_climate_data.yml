name: Update ENSO & IOD Data

on:
  # Jalan otomatis tiap hari jam 03:00 UTC (10:00 WITA).
  # BOM memperbarui data mingguan, jadi file baru hanya di-commit kalau ada perubahan.
  schedule:
    - cron: '0 3 * * *'
  # Tombol "Run workflow" manual di tab Actions
  workflow_dispatch:

permissions:
  contents: write  # dibutuhkan agar workflow bisa commit & push hasilnya

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # cache: 'pip'  <-- Hapus atau comment baris ini jika tidak ada file requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: Run ENSO processing script
        run: python process_enso.py

      - name: Run IOD processing script
        run: python process_iod.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nino34_bom_oni_format.csv nino34_bom_oni_format.xlsx \
                  iod_bom_dmi_format.csv iod_bom_dmi_format.xlsx
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data, tidak ada yang di-commit."
          else
            git commit -m "chore: update ENSO & IOD data ($(date -u +'%Y-%m-%d'))"
            git pull --rebase
            git push
          fi
